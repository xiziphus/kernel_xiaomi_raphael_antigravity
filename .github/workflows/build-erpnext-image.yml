name: Build ERPNext image (arm64)

# Builds a Frappe/ERPNext image with the extra bench apps baked in, for the
# phone. india_compliance and helpdesk are BENCH APPS, not containers -- they
# have to be present at image build time, so the stock frappe/erpnext image
# cannot be used as-is.
#
# Runs on GitHub's arm64 runner. Building arm64 on an Intel Mac means QEMU and
# hours; here it is native.

on:
  workflow_dispatch:
    inputs:
      frappe_branch:
        description: 'Frappe/ERPNext branch (the phone was on v16)'
        required: false
        default: 'version-16'
      india_compliance_branch:
        required: false
        default: 'version-16'
      helpdesk_branch:
        required: false
        default: 'main'

jobs:
  build:
    runs-on: ubuntu-24.04-arm
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout frappe_docker
        uses: actions/checkout@v4
        with:
          repository: frappe/frappe_docker
          ref: main

      - name: Compose apps.json
        id: apps
        run: |
          cat > apps.json <<EOF
          [
            {"url": "https://github.com/frappe/erpnext",              "branch": "${{ inputs.frappe_branch }}"},
            {"url": "https://github.com/resilient-tech/india-compliance", "branch": "${{ inputs.india_compliance_branch }}"},
            {"url": "https://github.com/frappe/telephony",            "branch": "${{ inputs.frappe_branch }}"},
            {"url": "https://github.com/frappe/helpdesk",             "branch": "${{ inputs.helpdesk_branch }}"}
          ]
          EOF
          cat apps.json

      - name: Log in to ghcr.io
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: images/layered/Containerfile
          platforms: linux/arm64
          push: true
          tags: ghcr.io/${{ github.repository_owner }}/erpnext-phone:latest
          build-args: |
            FRAPPE_PATH=https://github.com/frappe/frappe
            FRAPPE_BRANCH=${{ inputs.frappe_branch }}
            CACHE_BUST=${{ github.run_id }}
          # images/layered/Containerfile mounts apps.json as a BUILD SECRET
          # (--mount=type=secret,id=apps_json), not a build-arg. Passing
          # APPS_JSON_BASE64 was silently ignored: the image built fine and
          # contained only frappe, and the failure surfaced much later as
          # `No module named 'erpnext'` during bench new-site.
          secret-files: |
            apps_json=./apps.json
          # No cache-from. The apps are fetched in a single RUN layer, so a
          # cached layer from a build whose apps.json was wrong is reused
          # verbatim -- which is exactly what happened: the secret-files fix
          # below was correct and still produced a frappe-only image, because
          # buildx never re-ran the step. CACHE_BUST above covers the same
          # ground; belt and braces.
          no-cache: true

      - name: Verify the apps are actually in the image
        run: |
          # Do NOT skip this. A silently app-less image builds clean and only
          # fails ~10 minutes into `bench new-site` on the target, with
          # "No module named 'erpnext'". Twice.
          IMG=ghcr.io/${{ github.repository_owner }}/erpnext-phone:latest
          docker pull -q "$IMG"
          APPS=$(docker run --rm --entrypoint ls "$IMG" /home/frappe/frappe-bench/apps | tr '\n' ' ')
          echo "apps in image: $APPS"
          for a in frappe erpnext india_compliance telephony helpdesk; do
            echo "$APPS" | grep -qw "$a" || { echo "MISSING: $a"; exit 1; }
          done
          echo "all four apps present"
