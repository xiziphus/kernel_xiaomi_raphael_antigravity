# Services that are not ERPNext. ERPNext has its own compose (erpnext.yml)
# because frappe ships a reference stack that is easier to track upstream.
services:
  copyparty:
    image: copyparty/min:latest
    container_name: copyparty
    restart: always
    ports: ["3923:3923"]
    # NOT /sdcard -- sdcardfs does not propagate into the container's mount
    # namespace, so the bind silently becomes an empty tmpfs.
    volumes: ["/data/copyparty:/w"]
    command: >
      -a ${COPYPARTY_USER:-dell}:${COPYPARTY_PASS}
      -v /w::A,${COPYPARTY_USER:-dell}
      --xff-hdr cf-connecting-ip
      --xff-src 127.0.0.1/32,172.17.0.0/16

  portainer:
    image: portainer/portainer-ce:latest
    container_name: portainer
    restart: always
    ports: ["9000:9000", "9443:9443"]
    volumes:
      - /data/local/tmp/nd/docker.sock:/var/run/docker.sock
      - /data/portainer:/data
